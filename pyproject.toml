[project]
name = "chinese-contract-drafter"
version = "0.1.0"
description = "Multi-agent system for drafting Chinese legal contracts using CrewAI and Volcengine Ark"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm]>=1.15.5",
    "deepeval>=3.9.6",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-elasticsearch>=0.4",
    "llama-index-embeddings-openai-like>=0.3",
    "llama-index-readers-minio>=0.3",
    "elasticsearch>=8.15",
    "boto3>=1.34",
    "python-docx>=1.1",
    "pypdf>=6.14.2",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `external`: needs a live service (MinIO / Elasticsearch / LLM endpoint) or a
# populated object store; the release gate runs with `-m "not external"` and
# prints what it dropped. The suite is otherwise hermetic — it needs only a
# reachable PostgreSQL for the per-test databases.
markers = [
    "external: requires a live external service; excluded from the release gate",
]
