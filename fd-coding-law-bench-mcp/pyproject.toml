[project]
name = "fd-coding-law-bench-mcp"
version = "0.1.0"
description = "FastMCP server exposing law-bench contract generation, rubric evaluation, and RAG search as MCP tools."
requires-python = ">=3.12,<3.14"
# This project wraps the law-bench `src.*` modules in place. It runs in the
# shared law-bench venv (which already provides crewai, deepeval, llama-index,
# psycopg, python-docx, ...). Only FastMCP + dotenv are declared here; the rest
# are resolved from the shared environment, NOT re-declared.
dependencies = [
    "fastmcp>=3.2,<4",
    "python-dotenv>=1.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # HTTP API server dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "slowapi>=0.1.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_coding_law_bench_mcp"]
