# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive):
# push to hkccr (HK, fast transpacific leg) → cheap-3 tcr-relay backfills
# ccr.ccs.tencentyun.com (≤5 min cycle, skopeo byte-identical) → nodes pull
# from ccr (registries.yaml auth, no imagePullSecret needed).
# Jenkins→Harbor remains the fallback channel for this repo.
#
# Matrix on push: law-template (web app + bundled MCP) + law-render
# (extract-render-service: shared DOCX->PDF render pod).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: law-bench

jobs:
  # 测试先跑：合同模板/槽位审计/条款装配/评测规则是核心不变量，测试不过不应出片。
  # 套件是 hermetic 的，只要求一个可达 PostgreSQL（conftest 为每个用例建库）。
  # 需要真实 MinIO 的两个集成用例带 @pytest.mark.external，这里显式排除并打印清单。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: law_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public-repo leak gate (fail-closed)
        run: python3 scripts/check_public_hygiene.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # vendored path-source deps ([tool.uv.sources]): the name resolves on no
          # index, so install the wheel first — see pyproject.toml's note. Without
          # this line the whole release line is dead (No matching distribution).
          pip install vendor/fd_ontology_kernel-*.whl
          pip install -e .
          # fd-coding-law-bench-mcp 的 server.py 在 tests/test_tool_annotations.py
          # 导入链上（MCP 工具注解对账），fastmcp 是其声明依赖。
          pip install "fastmcp>=3.2,<4"
          pip install pytest

      - name: Test suite (external excluded)
        env:
          database_url: postgresql://app:app@localhost:5432/law_bench
          # 让 MinIO 探活立刻失败而不是等网络超时：本 job 不跑 external 用例，
          # 但 import 期构造的默认端点不能指向真实地址。
          minio_host: http://127.0.0.1:1
        run: |
          echo "== 被排除的 external 用例 =="
          python -m pytest tests -q -m external --collect-only || true
          echo "== 正式跑 =="
          python -m pytest tests -q -m "not external"

  build-push:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: law-template
            dockerfile: Dockerfile
          - image: law-render
            dockerfile: Dockerfile.render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 内容基线：读 main 当前 digest（未认证/不存在都容忍，空 = 首次构建）
      - id: prev
        name: 读 main 当前 digest（内容基线）
        run: |
          img="$REGISTRY/$NAMESPACE/${{ matrix.image }}"
          cur=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$cur" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.image }} main 当前 digest: ${cur:-<不存在，本次为首次构建>}"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=main

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 硬约束：开了 attestation，同内容两次构建 digest 必然不同，闸门永久失效。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 内容闸门：digest 变了才铸 sha-<commit>，让「同内容多 tag」结构上不可能。
      - name: 内容变了才铸不可变 tag
        env:
          NEW: ${{ steps.build.outputs.digest }}
          OLD: ${{ steps.prev.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          img="$REGISTRY/$NAMESPACE/${{ matrix.image }}"
          [ -n "$NEW" ] || { echo "::error::构建未产出 digest"; exit 1; }
          if [ "$NEW" = "$OLD" ]; then
            echo "内容未变（${NEW}）：不铸新 tag"
            {
              echo "### 内容未变，未产出新 tag"
              echo ""
              echo "本次构建与 \`main\` 当前指向完全一致。"
              echo ""
              echo "- 可直接 pin：\`$img@$NEW\`"
              echo "- 滚动引用：\`$img:main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$img:$tag" "$img@$NEW"
          echo "已铸 $tag → $NEW"
          {
            echo "### 内容有变化，已铸不可变 tag"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| digest | \`$NEW\` |"
            echo "| 上一内容 digest | \`${OLD:-<无>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
