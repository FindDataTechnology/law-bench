# Build MkDocs Material site and deploy to GitHub Pages.
# NOTE: The law-bench repo is PRIVATE, so GitHub Pages built from it is only
# visible to repo collaborators - NOT suitable for external sharing.
# For a PUBLIC shareable URL from a private repo, use Netlify/Vercel/Cloudflare
# (see docs/index.md or the netlify.toml in this directory).
name: Build Docs

on:
  push:
    branches: [main]
    paths:
      - 'fd-coding-law-bench-mcp/mkdocs.yml'
      - 'fd-coding-law-bench-mcp/docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fd-coding-law-bench-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fd-coding-law-bench-mcp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
