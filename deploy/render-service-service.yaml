# Render service endpoint: NodePort 30920, same exposure pattern as the
# fleet's other cheap-cluster services (30820 web, 30840 MCP, 31500 paas) —
# reachable over tailscale node IPs for ops verification, NOT proxied by the
# cheap1 Caddy edge and not in public DNS. In-cluster clients use
# http://render-service.law-bench.svc.cluster.local:8090.
apiVersion: v1
kind: Service
metadata:
  name: render-service
  namespace: law-bench
  labels:
    app: render-service
spec:
  type: NodePort
  selector:
    app: render-service
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30920
