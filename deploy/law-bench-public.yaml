# 公共 API pod（public-api-service：key-only fail-closed 读面 + 匿名概览窄豁免）。
# 同镜像不同工厂：PUBLIC_API=1 选择 create_public_app()（见 scripts/docker-entrypoint.sh）。
# 数据链=快照轨 replica（law-bench-public-replica + 15min sync CronJob）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: law-bench-public
  namespace: law-bench
  labels:
    app: law-bench-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: law-bench-public
  template:
    metadata:
      labels:
        app: law-bench-public
    spec:
      imagePullSecrets:
        - name: tcr-pull
      containers:
        - name: law-bench-public
          image: ccr.ccs.tencentyun.com/law-bench/law-template:sha-2180036
          imagePullPolicy: IfNotPresent
          env:
            - name: PUBLIC_API
              value: "1"
            - name: READONLY_REPLICA
              value: "1"
            - name: RATE_LIMIT_ENABLED
              value: "1"
          envFrom:
            - secretRef:
                name: law-bench-public
          ports:
            - containerPort: 8010
          livenessProbe:
            httpGet: {path: /healthz, port: 8010}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: 8010}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: law-bench-public
  namespace: law-bench
spec:
  type: NodePort
  selector:
    app: law-bench-public
  ports:
    - port: 8010
      targetPort: 8010
      nodePort: 30620
