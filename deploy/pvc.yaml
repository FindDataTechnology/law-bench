apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: law-bench-db
  namespace: law-bench
  annotations:
    # Persistent eval data: never delete the PVC, even if the ArgoCD app is removed.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
