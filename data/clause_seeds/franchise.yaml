# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# franchise (特许经营/加盟) consulted Kimi 2026-07-30; mirrors employment.yaml format.
contract_type: franchise
tags:
  - name: franchisor_filing_status
    values: [filed, not_filed, unknown]
    why: 特许人备案状态直接影响行政处罚风险及司法实践中的合同效力（《商业特许经营管理条例》第八条备案义务），通用risk维度无法区分行政合规风险
  - name: cooling_off_right
    values: [retained, waived_invalid, statutory_default]
    why: 特许经营特有的法定任意解除权（《商业特许经营管理条例》第十二条），不同于通用合同的违约解除或协商解除
  - name: territorial_exclusivity
    values: [provincial_exclusive, city_exclusive, standard_authorized, no_protection]
    why: 区域排他性等级决定加盟商市场价值核心要素，通用scope无法体现地理垄断权的法律边界
  - name: supply_chain_control
    values: [designated_brand, designated_supplier, fully_autonomous, ratio_capped]
    why: 供应链控制强度涉及反垄断法及《条例》对强制交易的规制，通用obligations无法提示合规红线
clauses:
  - family: 两店一年资格承诺
    section: 当事人
    body: >
      甲方承诺截至本合同签署日，其拥有至少 2 个直营店，且经营时间均超过 1 年（依据《商业特许经营管理条例》第七条）。
    stance: pro_b
    strength: standard
    why: 示范文本常忽略行政许可前置条件，属特许经营准入特有合规项，非通用买卖条款
    verdict: real
  - family: 信息披露书面确认
    section: 权利义务
    body: >
      乙方确认已于签约前{{days}}日收到《特许经营信息披露手册》，并核实内容真实完整（依据《商业特许经营管理条例》第二十二条）。
    slot_instructions:
      - name: days
        label: 提前披露天数
        description: 乙方在签约前收到信息披露手册的提前天数
        example: "15"
        required: true
    stance: pro_a
    strength: standard
    why: 示范文本常漏披露证据链，易引发后续以欺诈为由撤销合同，"已阅读确认"是特许经营特有的强举证信号
    verdict: real
  - family: 法定冷静期解除权
    section: 履行期限
    body: >
      合同签订后、正式开业前，乙方可单方解除合同，甲方应退还费用（依据《商业特许经营管理条例》第十二条）。
    stance: pro_b
    strength: strong
    why: 通用合同无此法定任意解除权，是特许经营区别于普通商业合作的标志性条款，示范文本常漏或被弱化
    verdict: real
  - family: 商标维护与续展责任
    section: 合同标的
    body: >
      甲方应负责维持注册商标有效性，若因甲方原因导致商标失效，应赔偿乙方损失（依据《商业特许经营管理条例》第三条及《商标法》）。
    stance: pro_b
    strength: standard
    why: 示范文本常假设商标天然有效，忽略维护成本分配与失效救济，属特许经营资源核心保障
    verdict: real
  - family: 供应链强制采购限制
    section: 价款及支付
    body: >
      乙方采购商品/原料须符合甲方标准，但甲方不得强制购买非必需物料。
    stance: pro_b
    strength: standard
    why: 示范文本常过度扩张甲方控制权，易触发反垄断审查，属特许经营特有合规风险点（属合同约定，无直接法条依据）
    verdict: real
skipped:
  - item: 保密条款
    reason: 属于所有商业合同通用条款，已在 base 权利义务中覆盖，无特许经营特异性
  - item: 争议解决管辖
    reason: 属于通用诉讼/仲裁条款，已在 base 争议解决章节覆盖，无需单独增加
  - item: 不可抗力
    reason: 属于民法典通用免责条款，非特许经营特有，归入 base 附则即可
  - item: 违约责任计算
    reason: 通用金钱债务违约规则，已在 base 违约责任章节覆盖，无需重复定义
  - item: 知识产权一般归属
    reason: 除特许经营商标许可外，其他 IP 归属属通用合同范畴，避免过度泛化
