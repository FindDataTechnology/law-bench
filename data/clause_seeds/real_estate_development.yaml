# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# real_estate_development consulted Kimi 2026-07-30; citations independently verified.
contract_type: real_estate_development
tags:
  - name: regulatory_permit_level
    values: [land, planning, construction, presale]
    why: 房地产开发是强行政许可行业，合同履行高度依赖特定证照的获取顺序（先施工证后预售证），通用"履行期限"无法表达证照间的法律因果关系
  - name: policy_shock_allocation
    values: [purchase_restriction, loan_restriction, price_control, tax_adjustment]
    why: 房地产受宏观调控（限购/限贷/限价/税率）影响极大，需明确因政府调控导致无法履约时的责任豁免或成本分担，通用"风险"标签过于模糊
  - name: statutory_warranty_class
    values: [main_structure, waterproof, decoration, pipeline]
    why: 开发商对房屋质量承担法定最低保修期（地基基础为设计使用年限），不同于一般货物的"合理期限"，通用"强度"无法量化法定责任底线
clauses:
  - family: 规划变更知情与异议
    section: 权利义务
    body: >
      甲方如需修改建设工程规划许可证确定的设计方案（包括户型、容积率等），须提前{{days}}日书面通知乙方。若该变更导致乙方利益受损（如投资回报降低），乙方有权要求补偿或解除合同。
      （依据：《城乡规划法》第43条关于规划变更程序的规定；变更通知及补偿安排属合同约定）
    stance: pro_b
    strength: strong
    why: 通用模板多只写"按图施工"，未规定规划变更对合作方/买方的实质性影响及救济路径（属合同约定，无直接法条依据）
    verdict: real
    slot_instructions:
      - name: days
        label: 提前通知天数
        description: 规划变更前甲方须提前书面通知乙方的天数
        example: 30
        required: true
  - family: 预售许可证取得义务
    section: 履行期限
    body: >
      甲方承诺于{{date}}前取得《商品房预售许可证》。逾期未取得的，每逾期一日，按已付房款的{{rate}}‰向乙方支付违约金；逾期超过{{days}}日，乙方有权单方解除合同并退还全部款项。
      （依据：《中华人民共和国城市房地产管理法》第45条）
    stance: pro_b
    strength: strong
    why: 通用"付款期限"未绑定"合法销售资格"；未取得预售证即收款属违法，此条款是合规红线
    verdict: real
    slot_instructions:
      - name: date
        label: 预售证取得期限
        description: 甲方承诺取得《商品房预售许可证》的截止日期
        example: 2025-06-30
        required: true
      - name: rate
        label: 逾期违约金率
        description: 逾期未取得预售证时每日按已付房款支付的违约金比例（‰）
        example: 1
        required: true
      - name: days
        label: 解除权触发天数
        description: 逾期超过该天数后乙方有权单方解除合同
        example: 90
        required: true
  - family: 土地增值税清算分担
    section: 价款及支付
    body: >
      本项目产生的土地增值税由甲乙双方按{{ratio}}比例承担。甲方负责办理清算申报，乙方应在收到甲方清算通知书后{{days}}日内配合提供资料，否则视为放弃抗辩权。
      （依据：《中华人民共和国土地增值税暂行条例》及相关实施细则）
    stance: pro_a
    strength: standard
    why: 通用"价款"仅指交易金额，未包含开发环节特有的高额税负分担机制，易引发结算纠纷
    verdict: real
    slot_instructions:
      - name: ratio
        label: 承担比例
        description: 甲乙双方土地增值税的分担比例
        example: 50%
        required: true
      - name: days
        label: 配合期限
        description: 乙方收到清算通知书后配合提供资料的天数
        example: 15
        required: true
  - family: 基础设施配套交付
    section: 合同标的
    body: >
      甲方应确保项目用地红线内的供水、供电、供气、道路达到{{standard}}标准，并于{{date}}前通过市政验收。未达到标准的，视为标的物交付不合格。
      （依据：《城市房地产开发经营管理条例》第17条）
    stance: pro_b
    strength: standard
    why: 通用"标的物"多描述物理面积，忽略市政接口（三通一平）的法定交付标准，是开发项目核心瑕疵点
    verdict: real
    slot_instructions:
      - name: standard
        label: 配套标准
        description: 项目用地红线内基础设施需达到的标准
        example: 市政管网接入并验收合格
        required: true
      - name: date
        label: 验收截止日期
        description: 基础设施通过市政验收的截止日期
        example: 2025-12-31
        required: true
skipped:
  - item: 保密条款
    reason: 属于所有商事合同的通用必备条款，无房地产开发特异性，归入通用库即可
  - item: 不可抗力定义
    reason: 通用模板已有自然灾害/战争等定义，无需针对地产单独扩充（政策风险另由 policy_shock_allocation 标签层处理）
  - item: 争议解决方式
    reason: base"争议解决"章节已覆盖，仲裁/诉讼选择属通用程序性约定，不增加实体权利
