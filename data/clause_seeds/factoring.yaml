# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# factoring (保理合同) - consulted Kimi 2026-07-30; mirrors employment.yaml format.
contract_type: factoring
tags:
  - name: recourse_type
    values: [with_recourse, without_recourse]
    why: 直接决定融资款无法收回时保理商向债务人主张权利还是向卖方回购（《民法典》第766条），是保理区别于借贷的核心特征；通用4维无法界定法律责任主体是债务人还是原债权人
  - name: confirmation_status
    values: [confirmed, unconfirmed, partial_confirmed]
    why: 涉及《民法典》第763条，债务人确认过应收账款存在后不得以不存在为由对抗保理商，影响债权真实性举证责任；通用stance无法体现债务人书面确认这一特定法律事实对债权效力的决定性作用
  - name: registration_status
    values: [registered, unregistered, pending_registration]
    why: 涉及《民法典》第768条，中登网登记是保理债权对抗善意第三人的关键要件，未登记可能导致优先权丧失；通用strength无法表达物权对抗效力这一法定生效要件
clauses:
  - family: 追索权行使路径
    section: 权利义务
    body: >
      本合同项下保理融资为【有追索权/无追索权】保理。若为有追索权，当债务人到期未付款时，甲方有权要求乙方回购应收账款或返还融资款本息；若为无追索权，除基础交易真实有效外，乙方不承担回购责任。（依据：《民法典》第766条）
    stance: pro_a
    strength: strong
    why: 通用模板常模糊处理还款来源，易混淆借贷担保关系；保理需明确区分信用风险承担方，非买卖/租赁通用大路货
    verdict: real
  - family: 虚假应收账款责任
    section: 违约责任
    body: >
      乙方保证应收账款真实、合法、有效。若因乙方提供虚假基础交易文件导致应收账款不存在，视为乙方根本违约，甲方有权立即宣布融资提前到期并要求乙方赔偿全部损失，且债务人不得以应收账款不存在对抗甲方。（依据：《民法典》第763条）
    stance: pro_a
    strength: strong
    why: 示范文本常忽略债务人抗辩权限制的特殊保护；将虚假陈述直接转化为违约责任，是保理特有风控点
    verdict: real
  - family: 转让通知义务
    section: 履行期限
    body: >
      乙方应在本合同生效后{{days}}个工作日内配合甲方向债务人发出《应收账款转让通知书》。在通知到达债务人前，债务人仍可向乙方清偿；通知到达后，债务人应向甲方清偿，否则不构成有效清偿。（依据：《民法典》第764条）
    slot_instructions:
      - name: days
        label: 通知期限（工作日）
        description: 乙方配合发出应收账款转让通知书的工作日数
        example: "5"
        required: true
    stance: pro_a
    strength: standard
    why: 通用债权转让条款较少强调通知生效的具体时限及未通知后果；保理中通知是锁定回款账户的关键动作
    verdict: real
  - family: 重复转让优先权
    section: 权利义务
    body: >
      若乙方将同一应收账款转让给第三方，双方同意按照以下顺序确定优先受偿权：1. 已在中国人民银行征信中心办理登记的，按登记时间先后；2. 均未登记的，按通知到达债务人的时间先后。（依据：《民法典》第768条）
    stance: balanced
    strength: standard
    why: 示范文本极少涉及一债多卖时的内部顺位规则；保理业务中登记制度是核心，须明确顺位以避免权利冲突
    verdict: real
skipped:
  - item: 一般保密条款
    reason: 属于所有商事合同的通用条款，无保理特异性，归入通用库即可
  - item: 不可抗力条款
    reason: 标准法律概念，适用于所有合同类型，无需针对保理单独定制
  - item: 利息/费率计算
    reason: 已包含在「价款及支付」章节的 base 条文中，冗余，无额外起草信号
  - item: 反洗钱合规声明
    reason: 虽重要但通常作为监管合规附件或 KYC 流程，不属于合同实体权利义务核心，建议归入附则或另行签署合规承诺函
  - item: 管辖法院约定
    reason: 属于「争议解决」章节的标准配置，除非涉及特殊金融仲裁，否则无保理特有性
