# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# insurance (保险合同) seed - consulted Kimi 2026-07-30; mirrors employment.yaml format.
contract_type: insurance
tags:
  - name: exclusion_notice_form
    values: [加粗, 下划线, 单独签字确认, 普通字体]
    why: 依据《保险法》第17条，免责条款需“足以引起注意”的特定物理形式，否则不生效；通用标签无法区分合规形式
  - name: waiting_period
    values: [无, 30天, 60天, 90天, 180天]
    why: 健康险/寿险特有机制，用于防范逆选择，决定保险责任起算点；通用“履行期限”无法体现此法定/约定排除期
  - name: claim_limitation_type
    values: [人寿保险5年, 非人寿保险2年]
    why: 依据《保险法》第26条，区别于《民法典》3年普通诉讼时效，直接影响诉权存续；通用“风险”标签无法量化该法定期间
clauses:
  - family: 如实告知义务
    section: 权利义务
    body: >
      订立本合同时，保险人就保险标的或者被保险人的有关情况提出询问的，投保人应当如实告知。若故意或因重大过失未履行前款规定的如实告知义务，足以影响保险人决定是否同意承保或者提高保险费率的，保险人有权解除合同。
      （依据：《保险法》第16条）
    stance: pro_a
    strength: strong
    why: 通用模板常仅写“提供真实信息”，未明确“询问主义”原则及解除后的保费退还规则（故意不退/过失可退），易引发理赔纠纷
    verdict: real
  - family: 免责条款明确说明
    section: 权利义务
    body: >
      对保险合同中免除保险人责任的条款，保险人在订立合同时应当在投保单、保险单或者其他保险凭证上作出足以引起投保人注意的提示，并对该条款的内容以书面或者口头形式向投保人作出明确说明；未作提示或者明确说明的，该条款不产生效力。
      （依据：《保险法》第17条）
    stance: pro_b
    strength: strong
    why: 示范文本常忽略“提示形式”的具体要求（如加粗/单独签字），导致司法实践中免责条款被认定无效的风险极高
    verdict: real
  - family: 宽限期与合同中止
    section: 履行期限
    body: >
      分期支付保险费的，投保人支付首期保险费后，除合同另有约定外，投保人自保险人催告之日起超过三十日未支付当期保险费，或者超过约定的期限六十日未支付当期保险费的，合同效力中止，或者由保险人按照合同约定的条件减少保险金额。
      （依据：《保险法》第36条）
    stance: balanced
    strength: standard
    why: 通用“价款及支付”仅约定付款时间，未涵盖法律强制的“宽限期”及“中止”后果，易造成合同效力状态不明
    verdict: real
  - family: 保险人代位求偿权
    section: 权利义务
    body: >
      因第三者对保险标的损害而造成保险事故的，保险人自向被保险人赔偿保险金之日起，在赔偿金额范围内代位行使被保险人对第三者请求赔偿的权利。被保险人不得损害保险人的代位求偿权。
      （依据：《保险法》第60条）
    stance: pro_a
    strength: strong
    why: 财产险特有，通用模板多关注赔付流程，忽略保险人取得追偿权后的被保险人配合义务及放弃追偿的限制
    verdict: real
  - family: 保险金请求权时效
    section: 权利义务
    body: >
      人寿保险以外的其他保险的被保险人或者受益人，向保险人请求赔偿或者给付保险金的诉讼时效期间为二年，自其知道或者应当知道保险事故发生之日起计算。人寿保险的被保险人或者受益人向保险人请求给付保险金的诉讼时效期间为五年，自其知道或者应当知道保险事故发生之日起计算。
      （依据：《保险法》第26条）
    stance: balanced
    strength: standard
    why: 常被误用《民法典》3年普通时效，实际保险法有特别规定（2年/5年），属于高频法律适用错误点
    verdict: real
skipped:
  - item: 通用违约责任
    reason: 已包含在 base 条文「违约责任」中，无需重复起草，避免与保险法特别规定冲突
  - item: 争议解决管辖
    reason: 已包含在 base 条文「争议解决」中，除非涉及专属管辖，否则无需增加保险特有内容
  - item: 不可抗力
    reason: 属《民法典》通用条款，非保险合同特有风险分配机制，归入「附则」即可
  - item: 保密条款
    reason: 属商业合同通用条款，非保险法律关系核心要素，且通常受监管法规约束而非合同约定
