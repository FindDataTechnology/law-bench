# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# intermediation mirrors employment (consulted Kimi 2026-07-30).
contract_type: intermediation
tags:
  - name: commission_trigger_mode
    values: [deal_closed, cost_incurred_no_deal, stage_based]
    why: 《民法典》第963条规定中介费通常以“促成合同成立”为条件，与普通服务合同“按时付费”有本质区别；通用“价款”维度仅关注金额不关注结果导向的法律定性，无法替代
  - name: broker_conflict_status
    values: [exclusive, non_exclusive, dual_agency_disclosed]
    why: 《民法典》第962条禁止中介人隐瞒重要事实或提供虚假情况（如私下吃差价），双重代理披露义务为中介特有诚信义务；通用“风险”标签太宽泛，无法精准控制“吃差价”特定法律风险
  - name: anti_tiao_scope
    values: [own_listings_only, own_channel_info, unrestricted]
    why: 《民法典》第965条专门针对“利用中介提供的机会绕开中介”设定付费义务，“跳单”为中介合同特有概念；通用“违约责任”无法定义何为“跳单”，需独立标签控制
clauses:
  - family: 如实报告与过错赔偿责任
    section: 权利义务
    body: >
      中介人应当就有关订立合同的事项向委托人如实报告。中介人故意隐瞒与订立合同有关的重要事实或者提供虚假情况，损害委托人利益的，不得请求支付报酬并应当承担赔偿责任。（依据：《民法典》第962条）
    stance: pro_a
    strength: strong
    why: 通用服务合同模板常忽略“故意隐瞒导致不得收费”的惩罚性后果，仅写一般违约；此为中介核心法定义务，示范文本常漏
    verdict: real
  - family: 禁止跳单（绕开签约）责任
    section: 违约责任
    body: >
      委托人在接受中介服务后，利用中介人提供的交易机会或者媒介服务，绕开中介人直接与相对人订立合同的，应当向中介人支付报酬。（依据：《民法典》第965条）
    stance: pro_b
    strength: strong
    why: 示范文本多只写“违约罚款”，未明确“跳单”这一特定行为模式及其法律后果（视为促成），为中介特有
    verdict: real
  - family: 未促成交易的费用承担
    section: 价款及支付
    body: >
      中介人未促成合同成立的，不得请求支付报酬；但是，可以按照约定请求委托人支付从事中介活动支出的必要费用。（依据：《民法典》第964条）
    stance: balanced
    strength: standard
    why: 通用合同常默认“无论成败均付服务费”，中介合同法定原则为“成则收佣，不成仅报销必要费用”，示范文本常漏
    verdict: real
  - family: 禁止吃差价（转手牟利）
    section: 权利义务
    body: >
      中介人不得利用提供中介服务的便利，隐瞒交易价格、赚取差价。若存在此类行为，委托人有权解除合同并要求返还已付款项。（依据：《民法典》第962条）
    stance: pro_a
    strength: standard
    why: 禁止吃差价为中介特有商业道德风险，系《民法典》第962条如实报告义务的延伸适用（隐瞒交易价格属于隐瞒与订立合同有关的重要事实）；通用模板极少提及”差价”概念，示范文本常漏
    verdict: real
skipped:
  - item: 保密条款
    reason: 通用合同必备条款，所有类型合同均有，非中介特有，归入通用“附则”或“权利义务”即可
  - item: 不可抗力
    reason: 标准通用免责条款，对中介合同无特殊法律意义，无需单独提取
  - item: 争议解决方式
    reason: 已在 base 条文知识库「争议解决」章节覆盖，冗余
  - item: 一般性陈述与保证
    reason: 过于笼统，中介合同核心在于“如实报告”而非一般性陈述，避免条款冗余
