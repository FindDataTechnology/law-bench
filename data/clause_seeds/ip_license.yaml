# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# ip_license (知识产权许可合同) - consulted Kimi 2026-07-30; legal citations verified
# against current law texts (专利法/著作权法/商标法/民法典/专利法实施细则).
contract_type: ip_license
tags:
  - name: exclusivity_level
    values: [exclusive, sole, non_exclusive]
    why: 决定被许可人能否对抗许可方再许可及独立起诉侵权人，是知识产权许可的核心商业价值点，通用"强度"维度无法量化法律上的排他效力
  - name: improvement_ownership
    values: [licensor, licensee, joint, grant_back]
    why: 涉及衍生知识产权的所有权分割与无偿回授，直接影响双方后续研发激励与资产积累，通用合同无此概念
  - name: litigation_standing
    values: [licensor_only, licensee_only, joint, consent_required]
    why: 明确谁有权针对第三方侵权发起诉讼，涉及程序法上的原告资格，通用"风险"维度不指定诉讼主体身份
clauses:
  - family: 许可性质与范围限定
    section: 合同标的
    body: >
      甲方授予乙方在【{{territory}}】区域内、于【{{field_of_use}}】领域内享有【{{exclusivity_type}}】的【{{ip_type}}】实施许可。未经书面同意，不得转授权。《中华人民共和国专利法》第十二条；《中华人民共和国著作权法》第二十六条。
    slot_instructions:
      - name: territory
        label: 许可地域
        description: 被许可人行使权利的地理区域范围
        example: 中华人民共和国境内
        required: true
      - name: field_of_use
        label: 使用领域
        description: 被许可人行使权利的技术或业务领域
        example: 医疗器械制造
        required: true
      - name: exclusivity_type
        label: 许可排他性
        description: 许可的排他性类型，如独占许可、排他许可或普通许可
        example: 排他许可
        required: true
      - name: ip_type
        label: 知识产权类型
        description: 被许可的知识产权类型，如专利权、著作权、商标权等
        example: 专利权
        required: true
    stance: balanced
    strength: standard
    why: 示范文本常笼统写"许可使用"，未区分独占/排他/普通，导致被许可人无法对抗第三人或许可方再许可
    verdict: real
  - family: 后续改进成果归属
    section: 权利义务
    body: >
      任何一方在合同期内对许可标的进行改进所产生的新的知识产权，其所有权归【{{owner_party}}】所有。若为双方合作开发，则归双方共有。《中华人民共和国民法典》第八百七十五条。
    slot_instructions:
      - name: owner_party
        label: 改进成果归属方
        description: 合同期内对许可标的进行改进所产生的新知识产权的所有权归属方
        example: 甲方
        required: true
    stance: balanced
    strength: standard
    why: 通用模板多忽略"后续改进"，易引发衍生技术权属纠纷，属知识产权许可特有高频争议点
    verdict: real
  - family: 权利无效后的费用调整
    section: 价款及支付
    body: >
      若本合同项下许可的专利权被宣告无效，自公告之日起，乙方无需支付后续许可费；已支付的，甲方应依据公平原则予以适当返还。《中华人民共和国专利法》第四十七条。
    stance: pro_b
    strength: strong
    why: 示范文本极少约定专利无效后的退费机制，但这是专利许可特有的重大财务风险敞口
    verdict: real
  - family: 侵权指控的应诉与抗辩
    section: 权利义务
    body: >
      如发生第三方指控乙方侵犯许可标的知识产权，甲方应在收到通知后【{{days}}】日内负责应诉并承担相关费用；若因甲方原因导致败诉，甲方应赔偿乙方损失。
    slot_instructions:
      - name: days
        label: 应诉期限（日）
        description: 甲方收到第三方侵权指控通知后负责应诉的日数
        example: "15"
        required: true
    stance: pro_b
    strength: strong
    why: 通用违约责任多针对违约行为而非外部第三方侵权防御，此条明确维权成本分担（属合同约定，无直接法条依据）
    verdict: real
  - family: 许可合同备案配合义务
    section: 附则
    body: >
      双方同意在本合同签订后【{{days}}】日内配合办理【{{ip_type}}】许可合同备案手续。因一方不配合导致备案延误的，由过错方承担行政罚款及相应损失。《中华人民共和国商标法》第四十三条；《专利法实施细则》第十四条。
    slot_instructions:
      - name: days
        label: 备案期限（日）
        description: 合同签订后双方配合办理许可合同备案手续的日数
        example: "30"
        required: true
      - name: ip_type
        label: 知识产权类型
        description: 需办理许可合同备案的知识产权类型，如商标权、专利权等
        example: 商标权
        required: true
    stance: balanced
    strength: standard
    why: 商标、专利许可备案具有对抗善意第三人的法律效力，通用合同常遗漏此合规动作
    verdict: real
skipped:
  - item: 保密条款
    reason: 属于通用商业合同标准条款，已在「权利义务」或「附则」base 中覆盖，无需知识产权特有化
  - item: 不可抗力
    reason: 通用法律事件定义，适用于所有合同类型，无知识产权特殊性
  - item: 一般违约责任
    reason: 基础库已有通用违约金计算方式，知识产权许可仅需补充上述特定违约情形（如侵权），无需重复通用条款
  - item: 争议解决
    reason: 管辖法院/仲裁机构选择属于通用程序条款，知识产权许可无特殊管辖规则（除涉外可能涉及），归入通用层即可
  - item: 交付物验收
    reason: 若为软件许可可能涉及交付，但通常归入「履行期限」或「合同标的」的具体描述，不作为独立特有条款
