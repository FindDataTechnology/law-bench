# Per-type seed manifest - produced by the analyze -> evaluate -> decide flow.
# equity_incentive (consulted Kimi 2026-07-30); mirrors the employment pilot format.
contract_type: equity_incentive
tags:
  - name: instrument_type
    values: [option, restricted_stock, phantom_stock, actual_shares]
    why: 不同激励工具对应不同确权时点、纳税义务发生时间及股东权利范围，通用"合同标的"无法区分法律后果，股权激励协议特有
  - name: exit_valuation_basis
    values: [nav, last_round_valuation, original_cost, third_party_appraisal]
    why: 股权退出涉及公允价值认定，直接影响回购成本与税务基数，通用"价款"仅指交易金额无法覆盖，股权激励协议特有
  - name: tax_burden_allocation
    values: [withholding, self_declaration, gross_up]
    why: 股权激励个税计算复杂（工资薪金vs财产转让），通用"税费"条款无法覆盖递延纳税备案或差额计税的特殊性，股权激励协议特有
clauses:
  - family: 离职回购价格公式
    section: 价款及支付
    body: >
      若激励对象在{{vesting_date}}前离职，公司有权以{{price_formula}}（如：原始出资额×(1+{{rate}}%×持有年限)）回购其全部未成熟股权。
      依据：《中华人民共和国公司法》第八十九条（有限责任公司异议股东回购请求权之参照适用）、《中华人民共和国个人所得税法》第六条。
    stance: pro_a
    strength: strong
    why: 通用模板多只写"按约定回购"，未明确计算公式，易引发离职纠纷；非买卖合同的固定价款逻辑，股权激励特有
    verdict: real
    slot_instructions:
      - name: vesting_date
        label: 回购触发截止日
        description: 激励对象在该日期前离职时公司有权回购未成熟股权的截止日期
        example: '2025-12-31'
        required: true
      - name: price_formula
        label: 回购价格公式
        description: 公司回购未成熟股权时的价格计算公式
        example: 原始出资额×(1+8%×持有年限)
        required: true
      - name: rate
        label: 年化收益率（%）
        description: 回购价格公式中的年化收益率，以百分比表示
        example: 8
        required: true
  - family: 业绩造假追回权
    section: 违约责任
    body: >
      若因激励对象提供虚假业绩证明导致授予生效，公司有权撤销授予并追回已行权收益，包括但不限于{{clawback_items}}。
      依据：《中华人民共和国民法典》第一百四十八条（欺诈可撤销）、第一百五十七条（返还财产）。
    stance: pro_a
    strength: strong
    why: 通用违约责任多为违约金，缺乏针对"基于虚假信息获取权益"的特定追回机制，股权激励特有
    verdict: real
    slot_instructions:
      - name: clawback_items
        label: 追回项目
        description: 公司有权追回的已行权收益具体项目
        example: 已行权股票收益及相应分红
        required: true
  - family: 税务申报配合义务
    section: 权利义务
    body: >
      激励对象应在收到行权通知后{{days}}日内向公司提供完税凭证，否则公司有权暂停办理工商变更登记并扣除相应款项。
      依据：《中华人民共和国个人所得税法》第九条（扣缴义务人规定）。
    stance: pro_a
    strength: standard
    why: 通用合同极少涉及协助对方完成法定纳税申报的义务，此条为股权类特有合规要求
    verdict: real
    slot_instructions:
      - name: days
        label: 完税凭证提供期限（日）
        description: 激励对象收到行权通知后向公司提供完税凭证的期限，单位为日历日
        example: 15
        required: true
  - family: 控制权变更加速行权
    section: 履行期限
    body: >
      若公司在{{vesting_period}}内发生控制权变更，所有未成熟期权自动加速至{{acceleration_percentage}}%成熟。
    stance: pro_b
    strength: standard
    why: 并购场景下对激励对象的特殊保护条款，通用"履行期限"通常仅指时间进度，不含事件触发加速；无直接法条强制，属意思自治范畴（属合同约定，无直接法条依据）
    verdict: real
    slot_instructions:
      - name: vesting_period
        label: 归属期
        description: 期权成熟的总归属期限，控制权变更在该期限内发生时触发加速行权
        example: 4年
        required: true
      - name: acceleration_percentage
        label: 加速成熟比例（%）
        description: 控制权变更时未成熟期权自动加速至成熟的百分比
        example: 100
        required: true
skipped:
  - item: 保密条款
    reason: 属于通用商业秘密保护，买卖/租赁/服务合同均必备，非股权激励特有
  - item: 不可抗力
    reason: 标准通用免责条款，无股权特殊性
  - item: 争议解决管辖
    reason: 通用程序性条款，不体现股权交易实质特征
  - item: 定义与解释
    reason: 基础合同结构要素，已在 base 条文"当事人/合同标的"中涵盖，冗余
  - item: 股权登记效力
    reason: 属于"合同标的"章节固有内容，若 base 已包含"股权交付"描述则无需重复，冗余
