[project]
name = "contract-review-agent"
version = "0.1.0"
description = "Multi-model contract review agent with human-in-the-loop checkpoints, built on LangGraph + CopilotKit."
requires-python = ">=3.12,<3.14"
# This agent runs in the shared law-template venv (which already provides
# deepeval, litellm, psycopg, langgraph, langchain-core, crewai, ...). Only
# CopilotKit + the AG-UI LangGraph bridge are declared here; the rest are
# resolved from the shared environment, NOT re-declared.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.2",
    "pydantic-settings>=2.0",
    "copilotkit>=0.1",
    "ag-ui-langgraph>=0.0.42",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=3.1.1",
    "python-docx>=1.2.0",
    "deepeval>=4.1.5",
    "litellm>=1.95.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api"]
